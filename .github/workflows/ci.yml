name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.0 fmt --all --check
      - name: Clippy
        run: cargo +1.98.0 clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +1.98.0 test --all-targets --locked
